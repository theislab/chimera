[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chimera"
version = "0.1.0"
description = "Cross-species scRNA-seq integration with learnable per-gene evolutionary gating"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core scvi-tools ecosystem
    "scvi-tools>=1.1.0",
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "mudata>=0.2.0",

    # PyTorch (scvi-tools will pull compatible version, but pin floor).
    # Wheel selection is platform-driven and handled by pip at install time:
    #   - macOS (arm64/x86_64): CPU + MPS wheel from PyPI (no CUDA on macOS).
    #   - Linux + NVIDIA GPU:   CUDA wheel from the default PyPI index.
    #   - Linux, CPU-only:      install via notebooks/00_environment.ipynb,
    #                           which routes to https://download.pytorch.org/whl/cpu.
    "torch>=2.1.0",
    "lightning>=2.1.0",

    # Experiment tracking
    "wandb>=0.16.0",

    # Hyperparameter optimization
    "optuna>=3.4.0",

    # Ensembl ortholog queries
    "pybiomart>=0.2.0",

    # Benchmarking
    "scib-metrics>=0.5.0",

    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",

    # Notebook support
    "jupyter>=1.0.0",
    "papermill>=2.5.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Pathway / gene-set enrichment (used by paper notebook 06).
    # Provides pre-ranked GSEA + ORA against MSigDB Hallmark, Reactome, GO BP,
    # KEGG via the Enrichr library catalog (cached locally on first call).
    "gseapy>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]
# Graph-neural-net bits. `scatter` has C++ extensions that import torch at
# build time → must be installed with --no-build-isolation AFTER torch.
# `graph` is pure-Python and builds under default build isolation.
scatter = [
    "torch-scatter>=2.1.0",
]
graph = [
    "torch-geometric>=2.4.0",
]
# Feature-attribution / interpretability stack for probing the VAE and GIN gates.
attributions = [
    "captum>=0.7.0",
    "shap>=0.44.0",
]
# Protein sequence + structure toolkit. fair-esm gives Meta's ESM-2 embeddings
# (already used in chimera's GIN feature vector), biopython covers sequence and
# structure IO, py3Dmol renders 3D structures inline in notebooks.
protein = [
    "biopython>=1.83",
    "fair-esm>=2.0.0",
    "py3Dmol>=2.0.4",
]
# Phylogenetics / evolution. dendropy is the canonical tree-manipulation lib
# and installs cleanly on Python 3.12 (ete3 does not yet).
evolution = [
    "dendropy>=5.0.1",
]
data = [
    "gdown>=4.7.0",
]
# Cross-method integration baselines for `chimera/training/baseline_runner.py`.
# After editing this list, re-sync via the "Force re-sync" cell in
# `chimera/notebooks/00_environment.ipynb` (never pip-install ad-hoc).
# Note: SysVI (cross-species VampPrior cVAE, theislab/cross_system_integration)
# now lives in scvi-tools as `scvi.external.SysVI`, so no separate package is
# pinned here — the scvi-tools dep above already provides it.
baselines = [
    "harmonypy>=0.0.10",
]
all = [
    "chimera[dev,scatter,graph,attributions,protein,evolution,data,baselines]",
]

[tool.setuptools.packages.find]
include = ["chimera*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
